<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecurePass: Генератор паролей</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
    --bg: #0a0a0f;
    --card-bg: rgba(20, 25, 40, 0.7);
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --accent-glow: rgba(99, 102, 241, 0.4);
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --option-bg: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.08);
    --container-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
}

[data-theme="light"] {
    --bg: #f0f4f8;
    --card-bg: rgba(255, 255, 255, 0.85);
    --text: #0f172a;
    --text-muted: #64748b;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-glow: rgba(79, 70, 229, 0.2);
    --option-bg: rgba(255, 255, 255, 0.6);
    --border: rgba(0, 0, 0, 0.06);
    --container-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Montserrat', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
    transition: background-color 0.5s, color 0.5s;
    overflow-x: hidden;
    position: relative;
}

/* === АНИМИРОВАННЫЙ ФОН === */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -2;
    background-image: 
        radial-gradient(circle at 15% 50%, var(--accent-glow), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(192, 132, 252, 0.1), transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    animation: bgPulse 10s ease-in-out infinite alternate, gridMove 20s linear infinite;
}

[data-theme="light"] body::before {
    background-image: 
        radial-gradient(circle at 15% 50%, var(--accent-glow), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(192, 132, 252, 0.1), transparent 40%),
        linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
}

@keyframes bgPulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
@keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 40px 40px; } }

.orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.3; animation: floatOrb 20s infinite ease-in-out alternate; pointer-events: none; }
.orb-1 { width: 300px; height: 300px; background: var(--accent); top: 10%; left: 10%; }
.orb-2 { width: 400px; height: 400px; background: #c084fc; bottom: 10%; right: 10%; animation-delay: -5s; }
@keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, -50px) scale(1.1); } 100% { transform: translate(-50px, 50px) scale(0.9); } }

/* === ОСНОВНОЙ КОНТЕЙНЕР === */
.container {
    background: var(--card-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    padding: 35px 30px; border-radius: 28px;
    box-shadow: var(--container-shadow);
    max-width: 500px; width: 100%; text-align: center;
    position: relative; overflow: hidden; z-index: 2;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.theme-toggle {
    position: absolute; top: 20px; right: 20px;
    background: var(--option-bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 50%; width: 40px; height: 40px;
    cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; z-index: 10;
}
.theme-toggle:hover { transform: scale(1.1) rotate(15deg); background: var(--border); }

h1 {
    font-size: 28px; font-weight: 900; margin-bottom: 5px;
    background: linear-gradient(135deg, #a78bfa, #818cf8, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
}
.subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; }

/* === БЛОК ПАРОЛЯ === */
.password-box {
    background: var(--option-bg);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: 0.3s;
}
.password-box:hover { border-color: var(--accent); }

.password-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    word-break: break-all;
    text-align: left;
    flex-grow: 1;
    color: var(--accent);
}

.copy-btn {
    background: var(--border);
    border: none;
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    transition: 0.2s;
    margin-left: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.copy-btn:hover { background: var(--accent); color: white; }
.copy-btn:active { transform: scale(0.9); }

/* === ИНДИКАТОР НАДЕЖНОСТИ === */
.strength-meter {
    height: 6px;
    background: var(--border);
    border-radius: 10px;
    margin-bottom: 25px;
    overflow: hidden;
    position: relative;
}
.strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    transition: 0.3s;
    background: var(--error);
}
.strength-text {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 5px;
    text-align: right;
    color: var(--text-muted);
}

/* === НАСТРОЙКИ === */
.settings {
    text-align: left;
    margin-bottom: 25px;
}
.setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}
.setting-item:last-child { border-bottom: none; }
.setting-label { font-size: 15px; font-weight: 600; }

/* Переключатель (Toggle) */
.switch { position: relative; display: inline-block; width: 50px; height: 28px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--border); transition: .4s; border-radius: 34px;
}
.slider:before {
    position: absolute; content: ""; height: 20px; width: 20px;
    left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;
}
input:checked + .slider { background-color: var(--accent); }
input:checked + .slider:before { transform: translateX(22px); }

/* Ползунок (Range) */
input[type=range] {
    -webkit-appearance: none; width: 100%; background: transparent; margin: 10px 0;
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 20px; width: 20px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
    margin-top: -8px; box-shadow: 0 0 10px var(--accent-glow);
}
input[type=range]::-webkit-slider-runnable-track {
    width: 100%; height: 4px; cursor: pointer;
    background: var(--border); border-radius: 2px;
}
input[type=range]:focus { outline: none; }
.length-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--accent);
    font-size: 18px;
}

/* Кнопка генерации */
.btn-generate {
    background: var(--accent); color: white; border: none;
    padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 800;
    cursor: pointer; width: 100%; transition: all 0.3s;
    box-shadow: 0 10px 25px -5px var(--accent-glow);
    text-transform: uppercase; letter-spacing: 1px;
    position: relative; overflow: hidden;
}
.btn-generate::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
}
.btn-generate:hover::after { left: 100%; }
.btn-generate:hover { transform: translateY(-3px); box-shadow: 0 15px 30px -5px var(--accent); background: var(--accent-hover); }
.btn-generate:active { transform: translateY(1px); }

/* Уведомление о копировании */
.toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--success); color: white; padding: 12px 24px;
    border-radius: 30px; font-weight: 600; font-size: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
    <h1>🔐 SecurePass</h1>
    <p class="subtitle">Генератор надежных паролей</p>

    <div class="password-box">
        <div class="password-text" id="password-display">Нажмите «Сгенерировать»</div>
        <button class="copy-btn" onclick="copyPassword()" title="Скопировать">📋</button>
    </div>

    <div class="strength-meter">
        <div class="strength-fill" id="strength-fill"></div>
    </div>
    <div class="strength-text" id="strength-text">Ожидание</div>

    <div class="settings">
        <div class="setting-item" style="flex-direction: column; align-items: flex-start;">
            <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px;">
                <span class="setting-label">Длина пароля</span>
                <span class="length-value" id="length-val">16</span>
            </div>
            <input type="range" min="4" max="50" value="16" id="length-slider" oninput="updateLength(this.value)">
        </div>
        
        <div class="setting-item">
            <span class="setting-label">Заглавные буквы (A-Z)</span>
            <label class="switch"><input type="checkbox" id="use-upper" checked><span class="slider"></span></label>
        </div>
        <div class="setting-item">
            <span class="setting-label">Строчные буквы (a-z)</span>
            <label class="switch"><input type="checkbox" id="use-lower" checked><span class="slider"></span></label>
        </div>
        <div class="setting-item">
            <span class="setting-label">Цифры (0-9)</span>
            <label class="switch"><input type="checkbox" id="use-numbers" checked><span class="slider"></span></label>
        </div>
        <div class="setting-item">
            <span class="setting-label">Символы (!@#$%...)</span>
            <label class="switch"><input type="checkbox" id="use-symbols" checked><span class="slider"></span></label>
        </div>
    </div>

    <button class="btn-generate" onclick="generatePassword()">Сгенерировать</button>
</div>

<div class="toast" id="toast">Пароль скопирован!</div>

<script>
// === ЛОГИКА ГЕНЕРАЦИИ ===
const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lowercase = "abcdefghijklmnopqrstuvwxyz";
const numbers = "0123456789";
const symbols = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

let currentPassword = "";

function updateLength(val) {
    document.getElementById('length-val').innerText = val;
}

function generatePassword() {
    const length = document.getElementById('length-slider').value;
    const useUpper = document.getElementById('use-upper').checked;
    const useLower = document.getElementById('use-lower').checked;
    const useNumbers = document.getElementById('use-numbers').checked;
    const useSymbols = document.getElementById('use-symbols').checked;

    let charset = "";
    if (useUpper) charset += uppercase;
    if (useLower) charset += lowercase;
    if (useNumbers) charset += numbers;
    if (useSymbols) charset += symbols;

    if (charset === "") {
        alert("Выберите хотя бы один параметр!");
        return;
    }

    let password = "";
    for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * charset.length);
        password += charset[randomIndex];
    }

    currentPassword = password;
    document.getElementById('password-display').innerText = password;
    document.getElementById('password-display').style.color = 'var(--text)';
    
    updateStrength(password);
}

function updateStrength(password) {
    let strength = 0;
    if (password.length > 8) strength += 1;
    if (password.length > 12) strength += 1;
    if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength += 1;
    if (/[0-9]/.test(password)) strength += 1;
    if (/[^A-Za-z0-9]/.test(password)) strength += 1;

    const fill = document.getElementById('strength-fill');
    const text = document.getElementById('strength-text');

    if (password === "") {
        fill.style.width = "0%";
        text.innerText = "Ожидание";
        text.style.color = "var(--text-muted)";
        return;
    }

    if (strength <= 2) {
        fill.style.width = "33%";
        fill.style.background = "var(--error)";
        text.innerText = "Слабый";
        text.style.color = "var(--error)";
    } else if (strength <= 4) {
        fill.style.width = "66%";
        fill.style.background = "var(--warning)";
        text.innerText = "Средний";
        text.style.color = "var(--warning)";
    } else {
        fill.style.width = "100%";
        fill.style.background = "var(--success)";
        text.innerText = "Надежный";
        text.style.color = "var(--success)";
    }
}

function copyPassword() {
    if (currentPassword === "") return;
    
    navigator.clipboard.writeText(currentPassword).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2000);
    });
}

// === ТЕМА ===
window.toggleTheme = () => {
    const body = document.body, btn = document.getElementById('theme-btn');
    if (body.getAttribute('data-theme') === 'light') { body.removeAttribute('data-theme'); btn.innerText = '🌙'; }
    else { body.setAttribute('data-theme', 'light'); btn.innerText = '☀️'; }
};

// Первая генерация при загрузке
window.onload = () => {
    generatePassword();
};
</script>
</body>
</html>
