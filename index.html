<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecurePass: Генератор паролей</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
    --bg: #0d1117;
    --card-bg: rgba(22, 27, 34, 0.8);
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #10b981; /* Мягкий изумруд */
    --accent-hover: #34d399;
    --accent-glow: rgba(16, 185, 129, 0.2);
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --option-bg: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.08);
    --container-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
}

[data-theme="light"] {
    --bg: #f0f7f4;
    --card-bg: rgba(255, 255, 255, 0.85);
    --text: #1f2937;
    --text-muted: #6b7280;
    --accent: #059669;
    --accent-hover: #047857;
    --accent-glow: rgba(5, 150, 105, 0.15);
    --option-bg: rgba(0, 0, 0, 0.02);
    --border: rgba(0, 0, 0, 0.06);
    --container-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Montserrat', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
    transition: background-color 0.5s, color 0.5s;
    overflow-x: hidden;
    position: relative;
}

/* Мягкий фоновый градиент */
body::before {
    content: "";
    position: fixed;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 60%);
    z-index: -1;
    animation: bgFloat 15s ease-in-out infinite alternate;
}

@keyframes bgFloat {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(10%, 10%) scale(1.1); }
}

/* Контейнер */
.container {
    background: var(--card-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    padding: 40px 30px;
    border-radius: 24px;
    box-shadow: var(--container-shadow);
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 2;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* Заголовок */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}
h1 {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), #34d399);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.theme-toggle {
    background: var(--option-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}
.theme-toggle:hover { background: var(--border); transform: scale(1.05); }

/* Блок пароля */
.password-box {
    background: var(--option-bg);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.password-box:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
}

.password-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    word-break: break-all;
    text-align: left;
    flex-grow: 1;
    color: var(--accent);
}

.copy-btn {
    background: var(--border);
    border: none;
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    margin-left: 10px;
    transition: 0.2s;
}
.copy-btn:hover { background: var(--accent); color: white; }
.copy-btn:active { transform: scale(0.9); }

/* Индикатор надежности */
.strength-bar {
    height: 6px;
    background: var(--border);
    border-radius: 10px;
    margin-bottom: 5px;
    overflow: hidden;
}
.strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: var(--error);
    transition: width 0.4s ease, background 0.4s ease;
}
.strength-text {
    font-size: 12px;
    font-weight: 600;
    text-align: right;
    margin-bottom: 25px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Настройки */
.settings {
    background: var(--option-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 25px;
}
.setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 600;
}
.setting-item:not(:last-child) { border-bottom: 1px solid var(--border); }

/* Красивые переключатели */
.switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 26px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--border);
    transition: .4s;
    border-radius: 34px;
}
.slider:before {
    position: absolute; content: "";
    height: 18px; width: 18px;
    left: 4px; bottom: 4px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
}
input:checked + .slider { background-color: var(--accent); }
input:checked + .slider:before { transform: translateX(20px); }

/* Ползунок длины */
input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
    margin-top: 10px;
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 22px; width: 22px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    margin-top: -9px;
    box-shadow: 0 0 10px var(--accent-glow);
    transition: transform 0.2s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
input[type=range]::-webkit-slider-runnable-track {
    width: 100%; height: 4px;
    cursor: pointer;
    background: var(--border);
    border-radius: 2px;
}
.length-value {
    color: var(--accent);
    font-weight: 800;
    font-size: 18px;
}

/* Кнопка генерации */
.btn-generate {
    background: var(--accent);
    color: white;
    border: none;
    padding: 18px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 800;
    width: 100%;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s;
    box-shadow: 0 10px 20px -10px var(--accent);
}
.btn-generate:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
    box-shadow: 0 15px 25px -10px var(--accent);
}
.btn-generate:active { transform: translateY(1px); }

/* Уведомление */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 10px 30px var(--accent-glow);
    opacity: 0;
    transition: 0.3s;
    pointer-events: none;
    z-index: 10;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔐 SecurePass</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
    </div>

    <div class="password-box">
        <div class="password-text" id="password-display">Нажмите «Сгенерировать»</div>
        <button class="copy-btn" onclick="copyPassword()" title="Скопировать">📋</button>
    </div>

    <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
    <div class="strength-text" id="strength-text">Ожидание</div>

    <div class="settings">
        <div class="setting-item" style="flex-direction: column; align-items: flex-start;">
            <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px;">
                <span>Длина пароля</span>
                <span class="length-value" id="length-val">16</span>
            </div>
            <input type="range" min="4" max="50" value="16" id="length-slider" oninput="updateLength(this.value)">
        </div>
        <div class="setting-item"><span>Заглавные буквы</span><label class="switch"><input type="checkbox" id="use-upper" checked><span class="slider"></span></label></div>
        <div class="setting-item"><span>Строчные буквы</span><label class="switch"><input type="checkbox" id="use-lower" checked><span class="slider"></span></label></div>
        <div class="setting-item"><span>Цифры</span><label class="switch"><input type="checkbox" id="use-numbers" checked><span class="slider"></span></label></div>
        <div class="setting-item"><span>Символы</span><label class="switch"><input type="checkbox" id="use-symbols" checked><span class="slider"></span></label></div>
    </div>

    <button class="btn-generate" onclick="generatePassword()">Сгенерировать</button>
</div>

<div class="toast" id="toast">Пароль скопирован!</div>

<script>
const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lowercase = "abcdefghijklmnopqrstuvwxyz";
const numbers = "0123456789";
const symbols = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

let currentPassword = "";

function updateLength(val) {
    document.getElementById('length-val').innerText = val;
}

function generatePassword() {
    const length = document.getElementById('length-slider').value;
    const useUpper = document.getElementById('use-upper').checked;
    const useLower = document.getElementById('use-lower').checked;
    const useNumbers = document.getElementById('use-numbers').checked;
    const useSymbols = document.getElementById('use-symbols').checked;

    let charset = "";
    if (useUpper) charset += uppercase;
    if (useLower) charset += lowercase;
    if (useNumbers) charset += numbers;
    if (useSymbols) charset += symbols;

    if (charset === "") {
        alert("Выберите хотя бы один параметр!");
        return;
    }

    let password = "";
    for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * charset.length);
        password += charset[randomIndex];
    }

    currentPassword = password;
    document.getElementById('password-display').innerText = password;
    updateStrength(password);
}

function updateStrength(password) {
    let strength = 0;
    if (password.length > 8) strength += 1;
    if (password.length > 12) strength += 1;
    if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength += 1;
    if (/[0-9]/.test(password)) strength += 1;
    if (/[^A-Za-z0-9]/.test(password)) strength += 1;

    const fill = document.getElementById('strength-fill');
    const text = document.getElementById('strength-text');

    if (strength <= 2) {
        fill.style.width = "33%"; fill.style.background = "var(--error)"; text.innerText = "Слабый"; text.style.color = "var(--error)";
    } else if (strength <= 4) {
        fill.style.width = "66%"; fill.style.background = "var(--warning)"; text.innerText = "Средний"; text.style.color = "var(--warning)";
    } else {
        fill.style.width = "100%"; fill.style.background = "var(--success)"; text.innerText = "Надежный"; text.style.color = "var(--success)";
    }
}

function copyPassword() {
    if (currentPassword === "") return;
    navigator.clipboard.writeText(currentPassword).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2000);
    });
}

window.toggleTheme = () => {
    const body = document.body, btn = document.getElementById('theme-btn');
    if (body.getAttribute('data-theme') === 'light') { 
        body.removeAttribute('data-theme'); 
        btn.innerText = '🌙'; 
    } else { 
        body.setAttribute('data-theme', 'light'); 
        btn.innerText = '☀️'; 
    }
};

window.onload = () => {
    generatePassword();
};
</script>
</body>
</html>
