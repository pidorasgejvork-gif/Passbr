<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RootPass: Secure Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

:root {
    --bg: #050505;
    --text: #00ff41; /* Хакерский зеленый */
    --text-muted: #008f11;
    --accent: #00ff41;
    --accent-glow: rgba(0, 255, 65, 0.2);
    --error: #ff003c;
    --warning: #ffb000;
    --success: #00ff41;
    --border: #1a1a1a;
    --panel: #0a0a0a;
}

[data-theme="light"] {
    --bg: #f4f4f4;
    --text: #003b00;
    --text-muted: #005500;
    --accent: #007700;
    --accent-glow: rgba(0, 119, 0, 0.1);
    --error: #cc0000;
    --warning: #cc8800;
    --success: #007700;
    --border: #dcdcdc;
    --panel: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'JetBrains Mono', monospace;
    background-color: var(--bg);
    color: var(--text);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
    transition: background-color 0.3s, color 0.3s;
}

/* Эффект сканирующих линий */
body::before {
    content: " ";
    display: block;
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 2;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
}

/* Контейнер */
.container {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 40px 30px;
    width: 100%;
    max-width: 500px;
    position: relative;
    z-index: 3;
    box-shadow: 0 0 20px rgba(0, 255, 65, 0.05);
}

/* Заголовок в стиле командной строки */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 10px;
}
h1 {
    font-size: 20px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
}
h1::before { content: "> "; color: var(--text-muted); }

.theme-toggle {
    background: transparent;
    border: 1px solid var(--text-muted);
    color: var(--text-muted);
    padding: 4px 8px;
    font-family: inherit;
    cursor: pointer;
    font-size: 12px;
    transition: 0.2s;
}
.theme-toggle:hover { border-color: var(--text); color: var(--text); }

/* Блок пароля */
.password-box {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 10px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.password-box::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
}
.password-box:hover::after { transform: scaleX(1); }

.password-text {
    font-size: 24px;
    font-weight: 700;
    word-break: break-all;
    text-align: left;
    flex-grow: 1;
    color: var(--text);
    text-shadow: 0 0 5px var(--accent-glow);
}

.copy-btn {
    background: transparent;
    border: 1px solid var(--text-muted);
    color: var(--text-muted);
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    margin-left: 15px;
    transition: 0.2s;
}
.copy-btn:hover { border-color: var(--text); color: var(--text); background: rgba(0, 255, 65, 0.1); }

/* Индикатор */
.strength-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 25px;
}
.strength-bar {
    flex-grow: 1;
    height: 4px;
    background: var(--border);
    position: relative;
}
.strength-fill {
    height: 100%;
    width: 0%;
    background: var(--error);
    transition: 0.3s;
}
.strength-text {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    min-width: 80px;
    text-align: right;
}

/* Настройки */
.settings {
    border: 1px solid var(--border);
    padding: 15px;
    margin-bottom: 25px;
}
.setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 14px;
}
.setting-item:not(:last-child) { border-bottom: 1px solid var(--border); }

/* Переключатели в стиле терминала */
.switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 20px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--bg); border: 1px solid var(--text-muted); transition: .2s;
}
.slider:before {
    position: absolute; content: ""; height: 12px; width: 12px;
    left: 3px; bottom: 3px; background-color: var(--text-muted); transition: .2s;
}
input:checked + .slider { border-color: var(--text); }
input:checked + .slider:before { transform: translateX(20px); background-color: var(--text); }

/* Ползунок длины */
input[type=range] {
    -webkit-appearance: none; width: 100%; background: transparent; margin-top: 5px;
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 16px; width: 16px;
    background: var(--text); cursor: pointer; margin-top: -6px;
}
input[type=range]::-webkit-slider-runnable-track {
    width: 100%; height: 4px; cursor: pointer; background: var(--border);
}
.length-value { color: var(--text); font-weight: 800; }

/* Кнопка */
.btn-generate {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--text);
    padding: 15px;
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.2s;
    position: relative;
    overflow: hidden;
}
.btn-generate:hover { background: rgba(0, 255, 65, 0.1); box-shadow: 0 0 15px var(--accent-glow); }
.btn-generate:active { transform: scale(0.98); }

/* Уведомление */
.toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 20px;
    font-size: 12px; font-weight: 800; text-transform: uppercase;
    opacity: 0; transition: 0.3s; pointer-events: none; z-index: 10;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SecurePass</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">[LIGHT_MODE]</button>
    </div>

    <div class="password-box">
        <div class="password-text" id="password-display">[ WAITING ]</div>
        <button class="copy-btn" onclick="copyPassword()">[ COPY ]</button>
    </div>

    <div class="strength-container">
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div class="strength-text" id="strength-text">N/A</div>
    </div>

    <div class="settings">
        <div class="setting-item" style="flex-direction: column; align-items: flex-start;">
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <span>PASSWORD_LENGTH</span>
                <span class="length-value" id="length-val">16</span>
            </div>
            <input type="range" min="4" max="50" value="16" id="length-slider" oninput="updateLength(this.value)">
        </div>
        <div class="setting-item"><span>USE_UPPERCASE</span><label class="switch"><input type="checkbox" id="use-upper" checked><span class="slider"></span></label></div>
        <div class="setting-item"><span>USE_LOWERCASE</span><label class="switch"><input type="checkbox" id="use-lower" checked><span class="slider"></span></label></div>
        <div class="setting-item"><span>USE_NUMBERS</span><label class="switch"><input type="checkbox" id="use-numbers" checked><span class="slider"></span></label></div>
        <div class="setting-item"><span>USE_SYMBOLS</span><label class="switch"><input type="checkbox" id="use-symbols" checked><span class="slider"></span></label></div>
    </div>

    <button class="btn-generate" onclick="generatePassword()">Generate_Password</button>
</div>

<div class="toast" id="toast">Password_Copied</div>

<script>
const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lowercase = "abcdefghijklmnopqrstuvwxyz";
const numbers = "0123456789";
const symbols = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

let currentPassword = "";

function updateLength(val) {
    document.getElementById('length-val').innerText = val;
}

function generatePassword() {
    const length = document.getElementById('length-slider').value;
    const useUpper = document.getElementById('use-upper').checked;
    const useLower = document.getElementById('use-lower').checked;
    const useNumbers = document.getElementById('use-numbers').checked;
    const useSymbols = document.getElementById('use-symbols').checked;

    let charset = "";
    if (useUpper) charset += uppercase;
    if (useLower) charset += lowercase;
    if (useNumbers) charset += numbers;
    if (useSymbols) charset += symbols;

    if (charset === "") {
        alert("ERROR: Select at least one parameter");
        return;
    }

    let password = "";
    for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * charset.length);
        password += charset[randomIndex];
    }

    currentPassword = password;
    document.getElementById('password-display').innerText = password;
    updateStrength(password);
}

function updateStrength(password) {
    let strength = 0;
    if (password.length > 8) strength += 1;
    if (password.length > 12) strength += 1;
    if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength += 1;
    if (/[0-9]/.test(password)) strength += 1;
    if (/[^A-Za-z0-9]/.test(password)) strength += 1;

    const fill = document.getElementById('strength-fill');
    const text = document.getElementById('strength-text');

    if (password === "") { fill.style.width = "0%"; text.innerText = "N/A"; return; }

    if (strength <= 2) {
        fill.style.width = "33%"; fill.style.background = "var(--error)"; text.innerText = "WEAK"; text.style.color = "var(--error)";
    } else if (strength <= 4) {
        fill.style.width = "66%"; fill.style.background = "var(--warning)"; text.innerText = "MEDIUM"; text.style.color = "var(--warning)";
    } else {
        fill.style.width = "100%"; fill.style.background = "var(--success)"; text.innerText = "STRONG"; text.style.color = "var(--success)";
    }
}

function copyPassword() {
    if (currentPassword === "") return;
    navigator.clipboard.writeText(currentPassword).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2000);
    });
}

window.toggleTheme = () => {
    const body = document.body, btn = document.getElementById('theme-btn');
    if (body.getAttribute('data-theme') === 'light') { 
        body.removeAttribute('data-theme'); 
        btn.innerText = '[LIGHT_MODE]'; 
    } else { 
        body.setAttribute('data-theme', 'light'); 
        btn.innerText = '[DARK_MODE]'; 
    }
};

window.onload = () => {
    generatePassword();
};
</script>
</body>
</html>
